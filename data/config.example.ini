; ============================================================================
; blivechat「发弹幕」插件配置
;
; 改完这个文件后，在控制台点“重载配置”即可生效，不用重启 blivechat。
; 控制台地址默认是 http://127.0.0.1:12452 ，点 blivechat 插件列表里的“管理”按钮也能打开。
;
; 注释以 ; 或 # 开头。布尔值写 true / false。
; ============================================================================


; ---------------------------------------------------------------------------
; 登录凭据
; 发弹幕必须用你本人的 B 站登录态，需要 cookie 里的两项：
;   SESSDATA  —— 登录态
;   bili_jct  —— 同时作为请求里的 csrf
;
; 默认会自动读取 blivechat“登录B站账号”插件保存的 cookie，通常不用改这里。
; ---------------------------------------------------------------------------
[account]

; cookie jar 路径。留空 = 自动探测（插件目录的 ../../cookie_jar.pickle）。
; 相对路径按插件目录算。
cookie_file =

; 手动指定要发到哪个直播间（真实房间ID，不是短号）。
; 留空(0) = 跟随 blivechat 当前连接的房间。填了就固定发到这个房间。
room_id = 0

; 身份码。填写后将自动查找对应的房间（需在 blivechat 里先添加该身份码的房间）。
; 优先级高于 room_id。身份码类似 "12345678"，不是短号也不是真实房间号。
; 留空 = 不使用身份码。
auth_code =

; 也可以在这里直接写 cookie，优先级高于 cookie_file。
; 一般不需要，留空即可。
; SESSDATA =
; bili_jct =
; DedeUserID =
; buvid3 =


; ---------------------------------------------------------------------------
; 弹幕发送参数
; ---------------------------------------------------------------------------
[danmaku]

; 两条弹幕之间的最小间隔（秒）。B 站限制较严，建议不要小于 2。
min_send_interval = 2

; 排队等待发送的最大条数，超出会直接拒绝并提示队列已满。
max_send_queue = 50

; 弹幕最大长度（字符）。普通用户 20，B站 UL20 以上等级可以到 30。
max_length = 20

; 单次发送请求的超时时间（秒）。
send_timeout = 10

; 弹幕颜色（十进制 RGB）。16777215 是白色。
; 注意：B 站接口目前对 color 的实际效果有限，官方文档标注“实际无效果”。
color = 16777215

; 弹幕字号，默认 25。
fontsize = 25

; 弹幕模式：1 = 滚动，4 = 底部，5 = 顶部。
mode = 1

; 试运行：只写日志、不真的发出去。调试规则时很有用。
dry_run = false


; ---------------------------------------------------------------------------
; 自动回复
; ---------------------------------------------------------------------------
[auto_reply]

; 总开关。
enabled = true

; 全局冷却（秒）：任意一条自动回复之后，至少等这么久才能再回。
; 注意这个值不能小于 min_send_interval，否则会被发送队列的限速拖住。
cooldown = 5

; 回复模板。可用变量：
;   {content}      规则里的回复内容
;   {author}       发弹幕的用户名
;   {uid}          用户ID
;   {level}        用户等级
;   {medal_level}  当前房间的勋章等级（没戴勋章为 0）
;   {medal_name}   勋章名
;   {guard_name}   舰队名（总督/提督/舰长，非舰队为空）
;   {keyword}      命中的关键词
;   {room_id}      房间ID
;   {time}         弹幕的 HH:MM:SS
;
; 留空或写成 {content} 就是只回规则里写的回复内容。
template = {content}

; 每分钟最多自动回复几条，0 = 不限制。可以当作额外的保护。
max_per_minute = 0

; 忽略“跨房弹幕”（其他房间飘过来的弹幕）。建议保持 true。
ignore_mirror = true

; 忽略勋章等级低于该值的弹幕，0 = 不过滤。设为 1 就只理戴了本房间勋章的人。
ignore_medal_level_below = 0

; 忽略用户等级低于该值的弹幕，0 = 不过滤。
min_author_level = 0

; 黑名单：按用户名或 uid 匹配，逗号或换行分隔。也可以用 uid:xxx / name:xxx 精确指定。
block_users =

; 白名单：非空时只处理名单内的用户。
allow_users =


; ---------------------------------------------------------------------------
; 本地控制台
; ---------------------------------------------------------------------------
[panel]

; 总开关。关掉后就只能用配置文件，没有手动发弹幕的界面了。
enabled = true

; 监听地址。只建议用 127.0.0.1，不要暴露到公网，因为控制台能替你发弹幕。
host = 127.0.0.1

; 端口。被占用了就换一个。
port = 12452

; 点 blivechat 插件列表里的“管理”按钮时，是否自动打开浏览器。
auto_open = true


; ---------------------------------------------------------------------------
; 与 blivechat 的交互
; ---------------------------------------------------------------------------
[sdk]

; 自动回复发出去的内容，是否也显示在 blivechat 弹幕栏里。
; 注意：发送者会显示成下面这个作者名，和真实观众弹幕可以区分开。
broadcast = true

; 播报到弹幕栏时显示的作者名。
broadcast_author = [自动回复]

; 多久收不到 blivechat 的消息就认为它已经退出（秒）。
; blivechat 每 30 秒发一次心跳，所以 35 秒没动静基本可以确定它没了，
; 插件会跟着退出，避免 blivechat 被强杀后留下僵尸进程。
connection_timeout = 35


; ===========================================================================
; 自动回复规则
;
; 每个 [rule-xxx] 段是一条规则，段名随意。规则里可以写：
;
;   name                 规则名，只用于日志显示，默认用段名
;   enabled              true / false
;   match_type           contains（包含）/ equals（完全相等）/ prefix（前缀）
;                        / suffix（后缀）/ regex（正则）
;   keywords             关键词，逗号或换行分隔
;   reply                回复内容。写多行时随机/轮换取一条
;   reply_mode           first（只用第一条）/ random（随机）/ sequence（轮流）
;   cooldown             本条规则的冷却（秒），0 = 用全局 cooldown
;   per_user_cooldown    同一用户触发本条规则的冷却（秒），0 = 不限
;   priority             优先级，越大越先匹配（默认 0）
;   command              是否响应弹幕指令 /关键词，默认 true
;   chat_trigger         是否响应普通弹幕内容，默认 true
;   require_guard        是否只允许舰队用户触发，默认 false
;   min_author_level     触发所需的最低用户等级
;   min_medal_level      触发所需的最低本房间勋章等级
;
; 关于“弹幕指令”：以 / 或 ! 开头的弹幕会被当成指令。比如规则关键词是“点歌”，
; 那么观众发「/点歌 起风了」就能触发。指令模式下也允许「/点歌」这样不带参数。
;
; 匹配顺序：priority 大的先匹配，命中就停。同一优先级按配置文件里的先后顺序。
; ===========================================================================

; --- 示例1：关键词自动回复（最常用）-----------------------------------------
[rule-greeting]
name = 打招呼
enabled = true
match_type = contains
keywords = 你好, 您好, 早上好, 晚上好
; 多条回复会按 reply_mode 选取
reply = 你好呀~, 欢迎欢迎！
reply_mode = random
cooldown = 10
per_user_cooldown = 60
priority = 0

; --- 示例2：弹幕指令，带参数 ------------------------------------------------
; 观众发「/点歌 起风了」或「!点歌 xxx」都能触发
[rule-song]
name = 点歌
enabled = false
match_type = prefix
keywords = 点歌
; 模板里用 {content} 取规则回复，用 {keyword} 取命中的关键词
reply = 收到，稍后就唱！
reply_mode = first
cooldown = 20
per_user_cooldown = 120
; 只在指令模式下触发，普通聊天里提到“点歌”不会触发
chat_trigger = false
priority = 10

; --- 示例3：正则匹配 --------------------------------------------------------
; 匹配类似 “666”、“6666”、“2333” 这种刷屏
; 注意：正则是「每行一个」，不能用逗号分隔（因为 {3,} 里的逗号有意义）
[rule-laugh]
name = 刷屏表情
enabled = false
match_type = regex
keywords = ^6{3,}$
           ^(23){2,}$
reply = 哈哈
reply_mode = first
cooldown = 30
priority = 0

; --- 示例4：只回舰队用户 ----------------------------------------------------
[rule-guard]
name = 舰队专属
enabled = false
match_type = contains
keywords = 打卡
reply = 舰长好！
require_guard = true
cooldown = 5
per_user_cooldown = 300
priority = 20
